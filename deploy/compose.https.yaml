# 与根目录 compose.yaml 合用，路径相对第一个 Compose 文件。
services:
  app:
    environment:
      ROUTE_HTTPS: "true"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ROUTE_DOMAIN: ${ROUTE_DOMAIN:?Set ROUTE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
